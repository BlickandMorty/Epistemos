# Epistemos Performance Budgets
#
# Canonical performance budget surface per
# `docs/audits/EXTENDED_PROGRAM_PLAN_2026_04_25.md` Wave 2.5
# Cross-ref: dpp §1.1 Task 0.5 (deterministic perf plan, Sprint 0)
#
# Edit policy: numbers in this file are CONTRACTS. Tightening a budget
# (lower number) is always allowed. LOOSENING a budget (higher number)
# requires a commit that explains why with a `# loosened YYYY-MM-DD: <reason>`
# trailer on the offending line.
#
# Parser: scripts/check-perf-budgets.sh (no TOML dependencies; uses awk/grep).
# CI gate: invoked from .github/workflows/ci.yml after the Patch 9 bundle step.
#
# The active Free App Store source guard keeps this contract product-scoped.

[binary]
# Per-dylib release-build ceiling (post fat-LTO + strip = "symbols").
# These gate REGRESSION — measured against the aarch64 release artifact.
# Current measurements (2026-04-25): listed in trailing comments.
#
# The Free MAS product retains only the deterministic epistemos-core dylib.
# Retired agent, MCP, and model-runtime binaries are validated by artifact
# absence checks rather than being treated as a performance-budget surface.
libepistemos_core_mb_max = 6    # actual 3.8

[appstore]
# Patch 9 already gates this in CI via env EPISTEMOS_APPSTORE_BUNDLE_SIZE_LIMIT_MB.
# Recorded here so the budget surface is one document, not split across CI yaml.
# Includes bundled product resources; NOT comparable to [binary] entries.
appstore_bundle_mb_max = 600

[runtime]
# Free MAS product targets. Until a current product harness writes the
# measurement file, the parser reports the debt and does not claim a result.
cold_start_ms_p99    = 800
frame_ms_p99         = 8.3
ffi_hot_path_us_p99  = 5.0

[keelstone.reference]
# KEELSTONE performance floor. Reference hardware: Apple silicon M2 Pro class.
# Reference vault: 10k notes. These are release-blocking once the CI measurement
# producer is wired.
hardware = "M2 Pro"
vault_notes = 10000

[keelstone.launch]
cold_to_interactive_p50_ms = 1500
cold_to_interactive_p95_ms = 2500
warm_to_interactive_p50_ms = 800

[keelstone.editor]
first_open_p50_ms = 150
first_open_p95_ms = 400

[keelstone.search]
first_search_ready_p50_ms = 2000
first_search_ready_p95_ms = 5000

[keelstone.reconcile]
# Incremental reconcile after an external change burst, no UI stall.
after_1000_changes_max_ms = 10000
main_thread_fs_ops = 0

[keelstone.memory]
idle_resident_mb_max = 500

[keelstone.thermal]
no_escalation_under_soak_minutes = 15

[keelstone.enterprise]
vault_notes = 100000

[keelstone.enterprise.budgets]
cold_to_interactive_p95_ms = 6000
first_search_ready_p95_ms = 20000
reconcile_20k_change_burst_max_ms = 60000
idle_resident_mb_max = 1200
wal_file_mb_max = 512

[meta]
# Only a current Free MAS product harness may write this measurement. The
# legacy benchmark path is intentionally distinct so it cannot supply Free
# runtime evidence by accident.
runtime_results_path = "build/perf-budgets-free-mas-runtime.json"

# Where the parser looks for KEELSTONE vault-sync durability/perf measurements.
# CI can prove this gate with KEELSTONE_SEED_PERF_REGRESSION=1.
keelstone_results_path = "build/perf-budgets-keelstone.json"
