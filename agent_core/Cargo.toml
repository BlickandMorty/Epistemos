# T23B Phase 2 Terminal F — falsifier harness binaries.
# All MAS-build by default; emit schema-conformant artifact JSON to
# artifacts/falsifiers/<name>/result.json. See
# docs/PHASE_2_TERMINAL_PROMPTS_2026_05_23.md §Terminal F + the per-bin
# header comment in src/bin/falsify_*.rs.
[[bin]]
name = "falsify_ulp_oracle"
path = "src/bin/falsify_ulp_oracle.rs"
# `research` feature gates `agent_core::research::fulp_oracle` (the CPU
# reference + 414,048-point acceptance grid). The harness IS research-
# tier infrastructure (T23B falsifier substrate), so this is correct:
# the bin compiles only with the research feature on.
required-features = ["research"]

