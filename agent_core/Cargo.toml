[package]
name = "agent_core"
version = "0.1.0"
edition = "2021"
publish = false

[features]
# Default = MAS build. The MAS sprint runs `cargo build` and gets the
# Mac App Store-shippable binary — no Pro-only surfaces compiled.
# Per `docs/fusion/MAS_FIRST_FOCUS_DOCTRINE_2026_05_03.md` §3.1.
default = ["mas-build"]
mas-build = ["edgeparse-pdf", "parser-unpdf"]
# Retired non-MAS compatibility marker. It is not an app target, product build,
# CI route, or release path; the only supported product configuration is
# `mas-build`.
pro-build = []
# Retired channel-relay marker; no product build enables it.
channel-relay-tools = []
# T14 / T15 research surfaces (Sherry 1.25-bit ternary, ANE direct).
# Independent of pro-build so research can compose with MAS or Pro.
research = []
# V2.3 in-process LSP runtime. Feature-gates the semantic LSP stack
# (`tower-lsp` LSP types + tree-sitter Rust/Swift parsing) so builds
# that do not use the editor LSP surface do not pay the compile cost.
lsp-runtime = ["tower-lsp", "tree-sitter", "tree-sitter-rust", "tree-sitter-swift"]
# A1 durable Cognitive DAG backend. Kept opt-in until Phase 8.H
# authority verification proves byte-identical parity against
# InMemoryDagStore across replay + mirror dispatch paths.
cognitive-dag-redb = ["redb"]
# Legacy alias kept for compatibility with anything still referencing
# `mas-sandbox`. New code should use `mas-build`.
mas-sandbox = []
# Plan 3 PDF→Markdown engine (owner 2026-06-28). EdgeParse + unpdf are pure-Rust,
# in-process, MAS-default deps. The older run-llama/liteparse PDFium path remains
# opt-in for Pro/dev only and is shadowed by EdgeParse when both are compiled.
edgeparse-pdf = ["dep:edgeparse-core"]
parser-unpdf = ["dep:unpdf"]
liteparse-pdf = ["dep:liteparse"]

[lib]
name = "agent_core"
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "epistemos_eml"
path = "src/bin/epistemos_eml.rs"
required-features = ["research"]

