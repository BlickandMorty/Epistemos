name: Epistemos
options:
  bundleIdPrefix: com.epistemos
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "16.0"
  defaultConfig: Debug
# The App Store target is the physically pruned Free V1 product. The normal
# `Epistemos` scheme builds the separate sandboxed base app with June.
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SUPPORTED_PLATFORMS: macosx
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: false
  configs:
    Debug:
      ENABLE_TESTABILITY: true
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      GCC_OPTIMIZATION_LEVEL: "0"
      SWIFT_COMPILATION_MODE: "singlefile"
      ONLY_ACTIVE_ARCH: true
      ENABLE_PREVIEWS: true
      DEBUG_INFORMATION_FORMAT: "dwarf"
      GCC_GENERATE_DEBUGGING_SYMBOLS: true
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-Osize"
      # Whole-module optimization: compile the module as a unit so the optimizer can
      # inline + specialize across files. Made explicit (xcodegen projects don't
      # reliably default Release to WMO) so the shipped MAS build is fully optimized.
      SWIFT_COMPILATION_MODE: "wholemodule"
      DEAD_CODE_STRIPPING: true
      LLVM_LTO: "YES"
      STRIP_INSTALLED_PRODUCT: true
      STRIP_SWIFT_SYMBOLS: true
      DEPLOYMENT_POSTPROCESSING: true
      GCC_OPTIMIZATION_LEVEL: "s"
      COPY_PHASE_STRIP: true

targets:
  Epistemos-AppStore:
    type: application
    platform: macOS
    sources:
      - path: Epistemos
        type: syncedFolder
        excludes:
          - JuneAgent/**
          - Resources/CoreEditor/chunks/**
      - path: build-rust/swift-bindings
        type: syncedFolder
        includes:
          - epistemos_core.swift
    resources:
      - path: Epistemos/Resources
        excludes:
          - CoreEditor/chunks/**
      - path: Epistemos/Resources/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_NAME: Epistemos
        PRODUCT_BUNDLE_IDENTIFIER: com.epistemos.appstore
        INFOPLIST_FILE: Epistemos-AppStore-Info.plist
        GENERATE_INFOPLIST_FILE: false
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Epistemos/Epistemos-AppStore.entitlements
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: false
        ENABLE_APP_SANDBOX: true
        SWIFT_EMIT_LOC_STRINGS: true
        ENABLE_PREVIEWS: true
        EPISTEMOS_PRODUCT_EDITION: FREE_V1
        SWIFT_OBJC_BRIDGING_HEADER: Epistemos-Bridging-Header.h
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path"
          - "@executable_path/../Frameworks"
          - "@loader_path/../Frameworks"
        OTHER_LDFLAGS: -L$(PROJECT_DIR)/build-rust/appstore -L$(PROJECT_DIR)/build-rust -lgraph_engine -lsyntax_core -lepistemos_core -lepistemos_shadow -lepistemos_code_index -lc++
        SWIFT_INCLUDE_PATHS: $(PROJECT_DIR)/build-rust/swift-bindings/epistemos_coreFFI
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
          DEVELOPMENT_TEAM: 3BNL2669SL
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG EPISTEMOS_APP_STORE MAS_SANDBOX EPISTEMOS_FREE_V1"
        Release:
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: 3BNL2669SL
          ENABLE_HARDENED_RUNTIME: true
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) EPISTEMOS_APP_STORE MAS_SANDBOX EPISTEMOS_FREE_V1"
    preBuildScripts:
      - name: Build Rust Engine
        script: |
          set -euo pipefail
          bash "${SRCROOT}/build-rust.sh"
          bash "${SRCROOT}/build-syntax-core.sh"
          MAS_SANDBOX=1 bash "${SRCROOT}/build-epistemos-core.sh"
          bash "${SRCROOT}/build-epistemos-shadow.sh"
          bash "${SRCROOT}/build-epistemos-code-index.sh"
          bash "${SRCROOT}/build-tiptap-bundle.sh"
          bash "${SRCROOT}/build-coreeditor-bundle.sh"
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Bundle Runtime Assets
        script: bash "${SRCROOT}/bundle-app-runtime-assets.sh"
        basedOnDependencyAnalysis: false
    dependencies:
      - package: GRDB
      - package: Grape
      - package: KokoroPipeline
        product: KokoroPipeline
      - package: MarkEditCore
      - sdk: AppKit.framework
      - sdk: SwiftUI.framework
      - sdk: SwiftData.framework
      - sdk: Foundation.framework
      - sdk: CryptoKit.framework
      - sdk: Security.framework
      - sdk: Network.framework
      - sdk: AppIntents.framework
      - sdk: CoreSpotlight.framework

  Epistemos:
    type: application
    platform: macOS
    sources:
      - path: Epistemos
        type: syncedFolder
        excludes:
          - Resources/CoreEditor/chunks/**
      - path: build-rust/swift-bindings
        type: syncedFolder
        includes:
          - epistemos_core.swift
          - agent_core.swift
    resources:
      - path: Epistemos/Resources
        excludes:
          - CoreEditor/chunks/**
      - path: Epistemos/Resources/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_NAME: Epistemos
        PRODUCT_BUNDLE_IDENTIFIER: com.epistemos.app
        INFOPLIST_FILE: Epistemos-Info.plist
        GENERATE_INFOPLIST_FILE: false
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Epistemos/Epistemos-AppStore.entitlements
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: false
        ENABLE_APP_SANDBOX: true
        SWIFT_EMIT_LOC_STRINGS: true
        ENABLE_PREVIEWS: true
        EPISTEMOS_PRODUCT_EDITION: BASE_JUNE
        SWIFT_OBJC_BRIDGING_HEADER: Epistemos-Bridging-Header.h
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path"
          - "@executable_path/../Frameworks"
          - "@loader_path/../Frameworks"
        OTHER_LDFLAGS: -L$(PROJECT_DIR)/build-rust/appstore -L$(PROJECT_DIR)/build-rust -lgraph_engine -lsyntax_core -lepistemos_core -lagent_core -lepistemos_shadow -lepistemos_code_index -lc++
        SWIFT_INCLUDE_PATHS: $(PROJECT_DIR)/build-rust/swift-bindings/epistemos_coreFFI $(PROJECT_DIR)/build-rust/swift-bindings/agent_coreFFI
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
          DEVELOPMENT_TEAM: 3BNL2669SL
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG EPISTEMOS_APP_STORE MAS_SANDBOX EPISTEMOS_FREE_V1 EPISTEMOS_BASE_JUNE"
        Release:
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: 3BNL2669SL
          ENABLE_HARDENED_RUNTIME: true
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) EPISTEMOS_APP_STORE MAS_SANDBOX EPISTEMOS_FREE_V1 EPISTEMOS_BASE_JUNE"
    preBuildScripts:
      - name: Build Rust Engine
        script: |
          set -euo pipefail
          bash "${SRCROOT}/build-rust.sh"
          bash "${SRCROOT}/build-syntax-core.sh"
          MAS_SANDBOX=1 bash "${SRCROOT}/build-epistemos-core.sh"
          MAS_SANDBOX=1 bash "${SRCROOT}/build-agent-core.sh"
          bash "${SRCROOT}/build-epistemos-shadow.sh"
          bash "${SRCROOT}/build-epistemos-code-index.sh"
          bash "${SRCROOT}/build-tiptap-bundle.sh"
          bash "${SRCROOT}/build-coreeditor-bundle.sh"
          bash "${SRCROOT}/build-june-web.sh"
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Bundle Runtime Assets
        script: bash "${SRCROOT}/bundle-app-runtime-assets.sh"
        basedOnDependencyAnalysis: false
    dependencies:
      - package: GRDB
      - package: Grape
      - package: KokoroPipeline
        product: KokoroPipeline
      - package: MarkEditCore
      - sdk: AppKit.framework
      - sdk: SwiftUI.framework
      - sdk: SwiftData.framework
      - sdk: Foundation.framework
      - sdk: CryptoKit.framework
      - sdk: Security.framework
      - sdk: Network.framework
      - sdk: AppIntents.framework
      - sdk: CoreSpotlight.framework

  EpistemosAppStoreKeelstoneTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: EpistemosAppStoreKeelstoneTests
        type: syncedFolder
    dependencies:
      - target: Epistemos-AppStore
      - package: GRDB
    postBuildScripts:
      - name: Stage Repository Source Guards
        script: |
          set -euo pipefail
          fixture_root="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/RepositorySourceFixtures"
          source_guards="
          ${SRCROOT}/EpistemosAppStoreKeelstoneTests/AppStoreKeelstoneLaneTests.swift
          ${SRCROOT}/EpistemosAppStoreKeelstoneTests/FreeV1BuildContractTests.swift
          "

          /bin/rm -rf "${fixture_root}"
          /bin/mkdir -p "${fixture_root}"

          for source_guard in ${source_guards}; do
            /usr/bin/sed -n 's/.*loadRepoTextFile("\([^"]*\)").*/\1/p' "${source_guard}"
          done | /usr/bin/sort -u \
            | while IFS= read -r relative_path; do
                source_path="${SRCROOT}/${relative_path}"
                destination_path="${fixture_root}/${relative_path}"
                case "${relative_path}" in
                  Epistemos/JuneAgent/*)
                    echo "note: skipping intentionally absent Free V1 source root Epistemos/JuneAgent/: ${relative_path}" >&2
                    continue
                    ;;
                esac
                if [[ ! -f "${source_path}" ]]; then
                  echo "error: missing repository source guard input: ${relative_path}" >&2
                  exit 1
                fi
                /bin/mkdir -p "$(/usr/bin/dirname "${destination_path}")"
                /bin/cp "${source_path}" "${destination_path}"
              done
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_NAME: EpistemosAppStoreKeelstoneTests
        PRODUCT_MODULE_NAME: EpistemosAppStoreKeelstoneTests
        PRODUCT_BUNDLE_IDENTIFIER: com.epistemos.appstore.keelstone-tests
        GENERATE_INFOPLIST_FILE: true
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 3BNL2669SL
        ALWAYS_SEARCH_USER_PATHS: false
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_OBJC_BRIDGING_HEADER: Epistemos-Bridging-Header.h
        SWIFT_INCLUDE_PATHS: $(PROJECT_DIR)/build-rust/swift-bindings/epistemos_coreFFI
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Epistemos.app/Contents/MacOS/Epistemos"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG EPISTEMOS_APP_STORE MAS_SANDBOX EPISTEMOS_FREE_V1"
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) EPISTEMOS_APP_STORE MAS_SANDBOX EPISTEMOS_FREE_V1"

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    version: 7.10.0
  Grape:
    url: https://github.com/SwiftGraphs/Grape
    from: 1.1.0
  KokoroPipeline:
    path: LocalPackages/KokoroPipeline
  MarkEditCore:
    path: LocalPackages/MarkEdit/MarkEditCore
schemes:
  Epistemos:
    build:
      targets:
        Epistemos: all
    run:
      executable: Epistemos
    archive:
      config: Release
  Epistemos-AppStore:
    build:
      targets:
        Epistemos-AppStore: all
        EpistemosAppStoreKeelstoneTests: [test]
    test:
      targets:
        - EpistemosAppStoreKeelstoneTests
    run:
      executable: Epistemos-AppStore
    archive:
      config: Release
