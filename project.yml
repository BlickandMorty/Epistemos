name: Epistemos
options:
  bundleIdPrefix: com.epistemos
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "16.0"
  defaultConfig: Debug
# Explicit build-configuration set. Debug + Release keep the historical implicit
# behavior; Experimental is the Developer-ID lane for the embedded 1Code agent
# surface (§16) — a Release-type build that additionally defines
# EPISTEMOS_EXPERIMENTAL and KINDRED_ENABLED on the main Epistemos target
# (see its settings.configs).
configs:
  Debug: debug
  Release: release
  Experimental: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SUPPORTED_PLATFORMS: macosx
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: false
  configs:
    Debug:
      ENABLE_TESTABILITY: true
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      GCC_OPTIMIZATION_LEVEL: "0"
      SWIFT_COMPILATION_MODE: "singlefile"
      # Wave 5 follow-up: EPISTEMOS_LINK_SUBSTRATE_RT enables the
      # RustEventRingClient at compile time. The host links libsubstrate_rt.a
      # via OTHER_LDFLAGS below. With the flag off the file compiles to
      # nothing and the host falls back to InMemoryEventRingClient.
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG EPISTEMOS_LINK_SUBSTRATE_RT"
      ONLY_ACTIVE_ARCH: true
      ENABLE_PREVIEWS: true
      DEBUG_INFORMATION_FORMAT: "dwarf"
      GCC_GENERATE_DEBUGGING_SYMBOLS: true
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-Osize"
      # Whole-module optimization: compile the module as a unit so the optimizer can
      # inline + specialize across files. Made explicit (xcodegen projects don't
      # reliably default Release to WMO) so the shipped MAS build is fully optimized.
      SWIFT_COMPILATION_MODE: "wholemodule"
      DEAD_CODE_STRIPPING: true
      LLVM_LTO: "YES"
      STRIP_INSTALLED_PRODUCT: true
      STRIP_SWIFT_SYMBOLS: true
      DEPLOYMENT_POSTPROCESSING: true
      GCC_OPTIMIZATION_LEVEL: "s"
      COPY_PHASE_STRIP: true

targets:
  Epistemos:
    type: application
    platform: macOS
    sources:
      - path: Epistemos
        type: syncedFolder
        excludes:
          - Engine/ClaudeManagedRuntime.swift
          - Omega/Knowledge/ODIATraceGenerator.swift
          - Omega/Knowledge/TraceDataMixer.swift
          - Resources/CoreEditor/chunks/**
          - Resources/chunks/**
          - Vault/KnowledgeGraphService.swift
      - path: LocalPackages/MarkEdit/MarkEditMac/Sources
        type: syncedFolder
        excludes:
          - Main/Application/**
          - Main/AppDocumentController.swift
          - Shortcuts/**
          - Scripting/EditorDocument+Scripting.swift
          - Scripting/NSColor+Scripting.swift
          - Updater/**
      - path: build-rust/swift-bindings
        type: syncedFolder
        includes:
          - "*.swift"
    resources:
      - path: Epistemos/Resources
        excludes:
          - CoreEditor/chunks/**
          - chunks/**
          - LaunchAgents/**
      - path: Epistemos/Resources/PrivacyInfo.xcprivacy
      - path: LocalPackages/MarkEdit/MarkEditMac/Resources
        excludes:
          - Assets.xcassets/**
      - path: LocalPackages/MarkEdit/MarkEditMac/Base.lproj
      - path: LocalPackages/MarkEdit/MarkEditMac/mul.lproj
      - path: LocalPackages/MarkEdit/MarkEditMac/AppShortcuts.xcstrings
    settings:
      base:
        PRODUCT_NAME: Epistemos
        PRODUCT_BUNDLE_IDENTIFIER: com.epistemos.app
        INFOPLIST_FILE: Epistemos-Info.plist
        GENERATE_INFOPLIST_FILE: false
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "Apple Development"
        SWIFT_EMIT_LOC_STRINGS: true
        ENABLE_PREVIEWS: true
        SWIFT_OBJC_BRIDGING_HEADER: Epistemos-Bridging-Header.h
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path"
          - "@executable_path/../Frameworks"
          - "@loader_path/../Frameworks"
        OTHER_LDFLAGS: -L$(PROJECT_DIR)/build-rust -lgraph_engine -lsyntax_core -lomega_mcp -lepistemos_core -lagent_core -lepistemos_shadow -lepistemos_code_index -lsubstrate_rt
        SWIFT_INCLUDE_PATHS: $(PROJECT_DIR)/build-rust/swift-bindings/omega_mcpFFI $(PROJECT_DIR)/build-rust/swift-bindings/epistemos_coreFFI $(PROJECT_DIR)/build-rust/swift-bindings/agent_coreFFI
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: 3BNL2669SL
          CODE_SIGN_ENTITLEMENTS: Epistemos/Epistemos-Debug.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG EPISTEMOS_EXPERIMENTAL KINDRED_ENABLED EPISTEMOS_LINK_SUBSTRATE_RT"
        Release:
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: 3BNL2669SL
          CODE_SIGN_ENTITLEMENTS: Epistemos/Epistemos.entitlements
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: false
          ENABLE_HARDENED_RUNTIME: true
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) EPISTEMOS_EXPERIMENTAL KINDRED_ENABLED EPISTEMOS_LINK_SUBSTRATE_RT"
        # Experimental agent surface (embedded 1Code, §16). Developer-ID lane:
        # same signing/hardened-runtime posture as Release, plus the compile flag
        # that activates Epistemos/ExperimentalAgent/**. build-experimental-web.sh
        # (in the shared preBuild below) graceful-skips when the fork isn't staged.
        Experimental:
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: 3BNL2669SL
          CODE_SIGN_ENTITLEMENTS: Epistemos/Epistemos.entitlements
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: false
          ENABLE_HARDENED_RUNTIME: true
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) EPISTEMOS_EXPERIMENTAL KINDRED_ENABLED EPISTEMOS_LINK_SUBSTRATE_RT"
    preBuildScripts:
      - name: Build Rust Engine
        script: "bash \"${SRCROOT}/build-rust.sh\" && bash \"${SRCROOT}/build-syntax-core.sh\" && bash \"${SRCROOT}/build-omega-mcp.sh\" && bash \"${SRCROOT}/build-epistemos-core.sh\" && bash \"${SRCROOT}/build-agent-core.sh\" && bash \"${SRCROOT}/build-epistemos-shadow.sh\" && bash \"${SRCROOT}/build-epistemos-code-index.sh\" && bash \"${SRCROOT}/build-substrate-rt.sh\" && bash \"${SRCROOT}/build-tiptap-bundle.sh\" && bash \"${SRCROOT}/build-coreeditor-bundle.sh\" && bash \"${SRCROOT}/build-opencode-runtime.sh\" && bash \"${SRCROOT}/build-experimental-web.sh\""
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Bundle Runtime Assets
        script: bash "${SRCROOT}/bundle-app-runtime-assets.sh"
        basedOnDependencyAnalysis: false
    dependencies:
      - package: GRDB
      - package: Grape
      # WORK = OpenCode shell (owner 2026-06-21): SwiftTerm = the native terminal view
      # (NSView LocalProcessTerminalView + PTY) that renders OpenCode's REAL terminal TUI
      # natively (Option A — keep the real terminal UI, not an Electron GUI, not a native
      # rebuild). Drives WorkShellLaunchSpec via startProcess. Pure Swift, MIT.
      - package: SwiftTerm
        product: SwiftTerm
      - package: KokoroPipeline
        product: KokoroPipeline
      - package: MarkEditCore
      - package: MarkEditKit
      - package: MarkEditModules
        product: AppKitControls
      - package: MarkEditModules
        product: AppKitExtensions
      - package: MarkEditModules
        product: FileDrop
      - package: MarkEditModules
        product: FileVersion
      - package: MarkEditModules
        product: FontPicker
      - package: MarkEditModules
        product: Previewer
      - package: MarkEditModules
        product: SettingsUI
      - package: MarkEditModules
        product: Statistics
      - package: MarkEditModules
        product: TextBundle
      - package: MarkEditModules
        product: TextCompletion
      - sdk: AppKit.framework
      - sdk: SwiftUI.framework
      - sdk: SwiftData.framework
      - sdk: Foundation.framework
      - sdk: CryptoKit.framework
      - sdk: Security.framework
      - sdk: Network.framework
      - sdk: AppIntents.framework
      - sdk: CoreSpotlight.framework

  Epistemos-AppStore:
    type: application
    platform: macOS
    sources:
      - path: Epistemos
        type: syncedFolder
        excludes:
          - Engine/ClaudeManagedRuntime.swift
          - Omega/Knowledge/ODIATraceGenerator.swift
          - Omega/Knowledge/TraceDataMixer.swift
          - Resources/CoreEditor/chunks/**
          - Resources/chunks/**
          - Vault/KnowledgeGraphService.swift
      - path: LocalPackages/MarkEdit/MarkEditMac/Sources
        type: syncedFolder
        excludes:
          - Main/Application/**
          - Main/AppDocumentController.swift
          - Shortcuts/**
          - Scripting/EditorDocument+Scripting.swift
          - Scripting/NSColor+Scripting.swift
          - Updater/**
      - path: build-rust/swift-bindings
        type: syncedFolder
        includes:
          - "*.swift"
    resources:
      - path: Epistemos/Resources
        excludes:
          - CoreEditor/chunks/**
          - chunks/**
      - path: Epistemos/Resources/PrivacyInfo.xcprivacy
      - path: LocalPackages/MarkEdit/MarkEditMac/Resources
        excludes:
          - Assets.xcassets/**
      - path: LocalPackages/MarkEdit/MarkEditMac/Base.lproj
      - path: LocalPackages/MarkEdit/MarkEditMac/mul.lproj
      - path: LocalPackages/MarkEdit/MarkEditMac/AppShortcuts.xcstrings
    settings:
      base:
        PRODUCT_NAME: Epistemos
        PRODUCT_BUNDLE_IDENTIFIER: com.epistemos.appstore
        INFOPLIST_FILE: Epistemos-AppStore-Info.plist
        GENERATE_INFOPLIST_FILE: false
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "Apple Development"
        CODE_SIGN_ENTITLEMENTS: Epistemos/Epistemos-AppStore.entitlements
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: false
        SWIFT_EMIT_LOC_STRINGS: true
        ENABLE_PREVIEWS: true
        SWIFT_OBJC_BRIDGING_HEADER: Epistemos-Bridging-Header.h
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path"
          - "@executable_path/../Frameworks"
          - "@loader_path/../Frameworks"
        OTHER_LDFLAGS: -L$(PROJECT_DIR)/build-rust -lgraph_engine -lsyntax_core -lomega_mcp -lepistemos_core -lagent_core -lepistemos_shadow -lepistemos_code_index -lsubstrate_rt
        SWIFT_INCLUDE_PATHS: $(PROJECT_DIR)/build-rust/swift-bindings/omega_mcpFFI $(PROJECT_DIR)/build-rust/swift-bindings/epistemos_coreFFI $(PROJECT_DIR)/build-rust/swift-bindings/agent_coreFFI
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
          DEVELOPMENT_TEAM: 3BNL2669SL
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG EPISTEMOS_APP_STORE MAS_SANDBOX EPISTEMOS_LINK_SUBSTRATE_RT"
        Release:
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: 3BNL2669SL
          ENABLE_HARDENED_RUNTIME: true
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) EPISTEMOS_APP_STORE MAS_SANDBOX EPISTEMOS_LINK_SUBSTRATE_RT"
    preBuildScripts:
      - name: Build Rust Engine
        script: "bash \"${SRCROOT}/build-rust.sh\" && bash \"${SRCROOT}/build-syntax-core.sh\" && MAS_SANDBOX=1 bash \"${SRCROOT}/build-omega-mcp.sh\" && bash \"${SRCROOT}/build-epistemos-core.sh\" && bash \"${SRCROOT}/build-agent-core.sh\" && bash \"${SRCROOT}/build-epistemos-shadow.sh\" && bash \"${SRCROOT}/build-epistemos-code-index.sh\" && bash \"${SRCROOT}/build-substrate-rt.sh\" && bash \"${SRCROOT}/build-tiptap-bundle.sh\" && bash \"${SRCROOT}/build-coreeditor-bundle.sh\""
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Bundle Runtime Assets
        script: bash "${SRCROOT}/bundle-app-runtime-assets.sh"
        basedOnDependencyAnalysis: false
      - name: Scrub Pro Frameworks
        script: |
          set -euo pipefail
          frameworks_dir="${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}"
        basedOnDependencyAnalysis: false
    dependencies:
      - package: GRDB
      - package: Grape
      - package: KokoroPipeline
        product: KokoroPipeline
      - package: MarkEditCore
      - package: MarkEditKit
      - package: MarkEditModules
        product: AppKitControls
      - package: MarkEditModules
        product: AppKitExtensions
      - package: MarkEditModules
        product: FileDrop
      - package: MarkEditModules
        product: FileVersion
      - package: MarkEditModules
        product: FontPicker
      - package: MarkEditModules
        product: Previewer
      - package: MarkEditModules
        product: SettingsUI
      - package: MarkEditModules
        product: Statistics
      - package: MarkEditModules
        product: TextBundle
      - package: MarkEditModules
        product: TextCompletion
      - sdk: AppKit.framework
      - sdk: SwiftUI.framework
      - sdk: SwiftData.framework
      - sdk: Foundation.framework
      - sdk: CryptoKit.framework
      - sdk: Security.framework
      - sdk: Network.framework
      - sdk: AppIntents.framework
      - sdk: CoreSpotlight.framework

  # AR1 — Control Center widget extension (Wave 15 §"#3").
  # macOS surfaces ControlWidgets ONLY from a `.appex` extension
  # bundle. The control entry points (`EpistemosCaptureControl`,
  # `EpistemosSandboxControl`) live in the main-app target source
  # at `Epistemos/Intents/Schemas/EpistemosControlWidget.swift`
  # because they reference the cognitive intents the main app owns;
  # this target's `@main` entry lives in `EpistemosWidgets/`.
  EpistemosWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: EpistemosWidgets
        type: syncedFolder
      # Pull in the control sources + the cognitive intents they
      # reference. xcodegen scopes the includes per-target so the
      # main app target still compiles them too (no duplicate-symbol
      # risk because each target is a separate bundle).
      - path: Epistemos/Intents/Schemas/EpistemosControlWidget.swift
      - path: Epistemos/Intents/Schemas/CognitiveIntents.swift
      - path: Epistemos/Engine/EpistemosSpeechSynthesizer.swift
      - path: Epistemos/Engine/QuarantineArchive.swift
      - path: Epistemos/Engine/EpistemosSidecar.swift
      - path: Epistemos/Engine/SidecarCache.swift
      - path: Epistemos/Engine/ConversationStateClassifier.swift
      - path: Epistemos/Engine/SessionTelemetryClassifier.swift
      - path: Epistemos/Engine/AFMSessionPool.swift
    settings:
      base:
        PRODUCT_NAME: EpistemosWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.epistemos.app.widgets
        INFOPLIST_FILE: EpistemosWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: false
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        SKIP_INSTALL: false
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../../../../Frameworks"
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
          DEVELOPMENT_TEAM: 3BNL2669SL
        Release:
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: 3BNL2669SL
          ENABLE_HARDENED_RUNTIME: true
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework

  EpistemosTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: EpistemosTests
        type: syncedFolder
    dependencies:
      - target: Epistemos
    preBuildScripts:
      - name: Bundle Test Source Mirror
        script: |
          set -euo pipefail
          output_dir="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/SourceMirror"
          mkdir -p "${output_dir}"

          prune_artifact_directories() {
            local destination_root="$1"

            if [ ! -d "${destination_root}" ]; then
              return 0
            fi

            find "${destination_root}" -type d \( \
              -name 'target' -o \
              -name '.build' -o \
              -name 'build' -o \
              -name 'DerivedData' -o \
              -name '.git' -o \
              -name 'node_modules' -o \
              -name '.venv' -o \
              -name 'venv' -o \
              -name '__pycache__' \
            \) -prune -exec rm -rf {} +
          }

          copy_tree() {
            local relative_root="$1"
            local source_root="${PROJECT_DIR}/${relative_root}"
            local destination_root="${output_dir}/${relative_root}"

            if [ ! -d "${source_root}" ]; then
              rm -rf "${destination_root}"
              return 0
            fi

            mkdir -p "${destination_root}"
            prune_artifact_directories "${destination_root}"
            rsync -a --delete --prune-empty-dirs \
              --exclude='target/' \
              --exclude='.build/' \
              --exclude='build/' \
              --exclude='DerivedData/' \
              --exclude='.git/' \
              --exclude='node_modules/' \
              --exclude='vendor/browser-use/' \
              --exclude='.venv/' \
              --exclude='venv/' \
              --exclude='__pycache__/' \
              --include='*/' \
              --include='*.swift' \
              --include='*.rs' \
              --include='*.py' \
              --include='*.ts' \
              --include='*.tsx' \
              --include='*.css' \
              --include='*.html' \
              --include='*.sh' \
              --include='*.yml' \
              --include='*.yaml' \
              --include='*.toml' \
              --include='*.h' \
              --include='*.pbxproj' \
              --include='*.plist' \
              --include='*.md' \
              --include='*.json' \
              --include='*.jsonl' \
              --include='*.png' \
              --include='lean-toolchain' \
              --include='*.lean' \
              --include='*.metal' \
              --include='*.xcprivacy' \
              --include='*.entitlements' \
              --include='*.udl' \
              --include='*.xcscheme' \
              --include='*.xcworkspacedata' \
              --exclude='*' \
              "${source_root}/" "${destination_root}/"
          }

          copy_file() {
            local relative_path="$1"
            local source_path="${PROJECT_DIR}/${relative_path}"
            local destination_path="${output_dir}/${relative_path}"

            if [ ! -f "${source_path}" ]; then
              rm -f "${destination_path}"
              return 0
            fi

            mkdir -p "$(dirname "${destination_path}")"
            rsync -a "${source_path}" "${destination_path}"
          }

          copy_tree "Epistemos"
          copy_tree "EpistemosTests"
          copy_tree "XPCServices"
          copy_tree "agent_core"
          copy_tree "artifacts/falsifiers/page_gather"
          copy_tree "artifacts/falsifiers/ulp_oracle"
          copy_tree "artifacts/lattice-coordinate-explainer"
          copy_tree "epistemos-code-index"
          copy_tree "epistemos-shadow"
          copy_tree "graph-engine"
          copy_tree "graph-engine-bridge"
          copy_tree "epistemos-core"
          copy_tree "epistemos-research"
          copy_tree "epistemos-vault"
          copy_tree "lean"
          copy_tree "omega-mcp"
          copy_tree "substrate-core"
          copy_tree "substrate-rt"
          copy_tree "syntax-core"
          copy_tree "syntax-core-bridge"
          copy_tree "js-editor/src"
          copy_file "js-editor/package.json"
          copy_file "js-editor/webpack.config.js"
          copy_tree "scripts"
          copy_tree "Tools"
          copy_tree "docs"
          copy_tree ".agents"
          copy_tree ".github"
          copy_tree "config"
          copy_tree "LocalPackages"
          copy_tree "Epistemos.xcodeproj"

          copy_file "AGENTS.md"
          copy_file "CLAUDE.md"
          copy_file "EPISTEMOS-NORTH-STAR.md"
          copy_file "Epistemos-Bridging-Header.h"
          copy_file "Epistemos-Info.plist"
          copy_file "Epistemos-AppStore-Info.plist"
          copy_file "project.yml"
          copy_file "Makefile"
          copy_file "TESTING_GUIDE.md"
          copy_file "patch-uniffi-bindings.py"
          copy_file "bundle-app-runtime-assets.sh"
          copy_file "embed-and-sign-rust-dylib.sh"
          copy_file "build-rust.sh"
          copy_file "build-syntax-core.sh"
          copy_file "build-omega-mcp.sh"
          copy_file "build-epistemos-core.sh"
          copy_file "build-agent-core.sh"
          copy_file "build-epistemos-shadow.sh"
          copy_file "build-epistemos-code-index.sh"
          copy_file "build-substrate-rt.sh"
          copy_file "build-tiptap-bundle.sh"
          copy_file "build-coreeditor-bundle.sh"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_NAME: EpistemosTests
        PRODUCT_MODULE_NAME: EpistemosTests
        PRODUCT_BUNDLE_IDENTIFIER: com.epistemos.tests
        GENERATE_INFOPLIST_FILE: true
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 3BNL2669SL
        ALWAYS_SEARCH_USER_PATHS: false
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_OBJC_BRIDGING_HEADER: Epistemos-Bridging-Header.h
        SWIFT_INCLUDE_PATHS: $(PROJECT_DIR)/build-rust/swift-bindings/omega_mcpFFI $(PROJECT_DIR)/build-rust/swift-bindings/epistemos_coreFFI $(PROJECT_DIR)/build-rust/swift-bindings/agent_coreFFI
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Epistemos.app/Contents/MacOS/Epistemos"

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    version: 7.10.0
  Grape:
    url: https://github.com/SwiftGraphs/Grape
    from: 1.1.0
  # WORK = OpenCode shell native terminal view (owner 2026-06-21). SwiftTerm
  # (migueldeicaza/SwiftTerm, MIT) — the macOS NSView terminal emulator + PTY host.
  # Vendored locally (lean ~5 MB, offline-deterministic) like vmlx-swift.
  SwiftTerm:
    path: LocalPackages/SwiftTerm
  KokoroPipeline:
    path: LocalPackages/KokoroPipeline
  MarkEditCore:
    path: LocalPackages/MarkEdit/MarkEditCore
  MarkEditKit:
    path: LocalPackages/MarkEdit/MarkEditKit
  MarkEditModules:
    path: LocalPackages/MarkEdit/MarkEditMac/Modules
schemes:
  Epistemos:
    build:
      targets:
        Epistemos: all
    test:
      targets:
        - EpistemosTests
    run:
      executable: Epistemos
    archive:
      config: Release
  Epistemos-AppStore:
    build:
      targets:
        Epistemos-AppStore: all
    run:
      executable: Epistemos-AppStore
    archive:
      config: Release
  # Experimental agent surface (embedded 1Code, §16). Builds the main Epistemos
  # target under the Experimental config so EPISTEMOS_EXPERIMENTAL is defined.
  Epistemos-Experimental:
    build:
      targets:
        Epistemos: all
      config: Experimental
    run:
      config: Experimental
      executable: Epistemos
    archive:
      config: Experimental
